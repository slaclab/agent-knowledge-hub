apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-knowledge-hub-dev

resources:
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - mongodb-statefulset.yaml
  - mongodb-service.yaml
  - mongodb-pvc.yaml

images:
  - name: agent-knowledge-hub-backend
    newName: agent-knowledge-hub-backend
    newTag: dev
  - name: agent-knowledge-hub-frontend
    newName: agent-knowledge-hub-frontend
    newTag: dev

configMapGenerator:
  - name: backend-config
    literals:
      - MONGO_URI=mongodb://mongodb:27017/agent-skills
      - GITHUB_API_URL=https://api.github.com
      - AUTH_MODE=dev
      - DEV_USER=devuser
      - ADMIN_USERS=devuser
    options:
      disableNameSuffixHash: true

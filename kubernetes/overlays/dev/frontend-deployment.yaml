apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-knowledge-hub-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-knowledge-hub-frontend
  template:
    metadata:
      labels:
        app: agent-knowledge-hub-frontend
    spec:
      # #033: run as UID 1000 with no capabilities and a read-only root filesystem.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: frontend
          image: slaclab/agent-knowledge-hub-frontend:0.20.1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: BACKEND_URL
              value: "http://agent-knowledge-hub-backend:8000"
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: agent-knowledge-hub-secrets
                  key: INTERNAL_API_SECRET
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nextjs-cache
              mountPath: /app/.next/cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nextjs-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}

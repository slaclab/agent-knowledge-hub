apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-knowledge-hub-frontend
  annotations:
    nginx.ingress.kubernetes.io/auth-url: https://vouch-dev.slac.stanford.edu/validate
    nginx.ingress.kubernetes.io/auth-signin: "https://vouch-dev.slac.stanford.edu/login?url=$scheme://$http_host$request_uri&vouch-failcount=$auth_resp_failcount&X-Vouch-Token=$auth_resp_jwt&error=$auth_resp_err"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-Vouch-User, X-Forwarded-User, X-Vouch-Idp-Claims-Name"
    nginx.ingress.kubernetes.io/auth-snippet: |
      auth_request_set $auth_resp_jwt $upstream_http_x_vouch_IdToken;
      auth_request_set $auth_resp_err $upstream_http_x_vouch_err;
      auth_request_set $auth_resp_failcount $upstream_http_x_vouch_failcount;
      auth_request_set $forwarded_user $upstream_http_x_vouch_idp_claims_name;
spec:
  rules:
    - host: agent-knowledge-hub-dev.slac.stanford.edu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-knowledge-hub-frontend
                port:
                  number: 3000

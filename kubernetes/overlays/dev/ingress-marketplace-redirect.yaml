apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-knowledge-hub-marketplace-redirect
  annotations:
    # No VouchProxy — this path must be publicly accessible for /plugin marketplace add.
    # Permanently redirect /marketplace.json → /cli/api/marketplace.json (the real backend path).
    nginx.ingress.kubernetes.io/permanent-redirect: "https://agent-knowledge-hub-dev.slac.stanford.edu/cli/api/marketplace.json"
spec:
  rules:
    - host: agent-knowledge-hub-dev.slac.stanford.edu
      http:
        paths:
          - path: /marketplace.json
            pathType: Exact
            backend:
              service:
                name: agent-knowledge-hub-frontend
                port:
                  number: 3000

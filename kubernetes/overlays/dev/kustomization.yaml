apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - namespace.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress-frontend.yaml
  - ingress-api.yaml
  - ingress-marketplace-redirect.yaml
  - mongodb/mongo.yaml
  - network-policy-backend.yaml

configMapGenerator:
  - name: backend-config
    literals:
      - GITHUB_API_URL=https://api.github.com
      - AUTH_MODE=vouchproxy
      - ADMIN_USERS=ytl
      - JWT_JWKS_URI=https://dex-dev.slac.stanford.edu/keys
      - JWT_ISSUER=https://dex-dev.slac.stanford.edu
      - JWT_AUDIENCE=s3df
      - APP_URL=https://agent-knowledge-hub-dev.slac.stanford.edu
      - SELF_PLUGIN_SLUG=agent-knowledge-hub-dev
      - SELF_SKILL_PATH=skills-dev
    options:
      disableNameSuffixHash: true

secretGenerator:
  - name: agent-knowledge-hub-secrets
    files:
      - etc/.secrets/MONGO_URI
      - etc/.secrets/GITHUB_APP_ID
      - etc/.secrets/GITHUB_APP_PRIVATE_KEY
      - etc/.secrets/GITHUB_TOKEN
      - etc/.secrets/INTERNAL_API_SECRET
    options:
      disableNameSuffixHash: true
  - name: mongodb-secrets
    files:
      - etc/.secrets/MONGODB_BACKUP_USER
      - etc/.secrets/MONGODB_BACKUP_PASSWORD
      - etc/.secrets/MONGODB_CLUSTER_ADMIN_USER
      - etc/.secrets/MONGODB_CLUSTER_ADMIN_PASSWORD
      - etc/.secrets/MONGODB_CLUSTER_MONITOR_USER
      - etc/.secrets/MONGODB_CLUSTER_MONITOR_PASSWORD
      - etc/.secrets/MONGODB_USER_ADMIN_USER
      - etc/.secrets/MONGODB_USER_ADMIN_PASSWORD
    options:
      disableNameSuffixHash: true

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml

images:
  - name: agent-knowledge-hub-backend
    newName: slaclab/agent-knowledge-hub-backend
    newTag: dev
  - name: agent-knowledge-hub-frontend
    newName: slaclab/agent-knowledge-hub-frontend
    newTag: dev

configMapGenerator:
  - name: backend-config
    literals:
      - GITHUB_API_URL=https://api.github.com
      - AUTH_MODE=dev
      - DEV_USER=devuser
      - ADMIN_USERS=devuser
    options:
      disableNameSuffixHash: true

secretGenerator:
  - name: agent-knowledge-hub-secrets
    files:
      - etc/.secrets/MONGO_URI
    options:
      disableNameSuffixHash: true

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: agent-knowledge-hub-backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                envFrom:
                  - configMapRef:
                      name: backend-config
                  - secretRef:
                      name: agent-knowledge-hub-secrets

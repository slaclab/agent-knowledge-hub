apiVersion: psmdb.percona.com/v1
kind: PerconaServerMongoDB
metadata:
  name: mongodb
spec:
  crVersion: 1.22.0
  image: percona/percona-server-mongodb:8.0.19-7
  allowUnsafeConfigurations: true
  updateStrategy: RollingUpdate
  secrets:
    users: mongodb-secrets
  replsets:
    - name: rs0
      size: 3
      volumeSpec:
        persistentVolumeClaim:
          resources:
            requests:
              storage: 10Gi
  sharding:
    enabled: true
    configsvrReplSet:
      size: 3
      volumeSpec:
        persistentVolumeClaim:
          resources:
            requests:
              storage: 3Gi
    mongos:
      size: 3
  backup:
    enabled: false
    image: percona/percona-backup-mongodb:2.9.1

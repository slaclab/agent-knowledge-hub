apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-knowledge-hub-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-knowledge-hub-backend
  template:
    metadata:
      labels:
        app: agent-knowledge-hub-backend
    spec:
      containers:
        - name: backend
          image: agent-knowledge-hub-backend:stage
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: agent-knowledge-hub-secrets
                optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
